<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact - Book Recommender System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">

    <style>
        body { background: #121212; color: white; font-family: Arial, sans-serif; }
        .navbar { background: #fff8dc !important; border: none; border-radius: 0; margin-bottom: 40px; padding: 10px 0; }
        .navbar-brand { font-size: 24px; font-weight: bold; color: #222 !important; }
        .navbar-nav li a { color: #222 !important; font-weight: 600; }
        .navbar-nav li a:hover { background: transparent !important; color: #ff9800 !important; }
        .card { background: #1e1e1e; border-radius: 15px; padding: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); max-width: 450px; margin: 50px auto; text-align: center; }
        .card h2 { margin-top: 0; font-weight: bold; }
        .contact-link { color: #ff9800; text-decoration: none; font-size: 20px; font-weight: bold; display: inline-block; margin-top: 15px; }
        .contact-link:hover { color: #e68a00; text-decoration: none; }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand">Libro</a>
            <ul class="nav navbar-nav">
                <li><a href="/">Home</a></li>
                <li><a href="/popular">Popular Books</a></li>
                <li><a href="/recommend">Recommend</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Contact Me</h2>
            <p style="color: #cfcfcf; font-size: 16px; margin-top: 15px;">If you have any queries, feel free to reach out:</p>
            <a href="mailto:pulkit@gmail.com" class="contact-link">pulkit@gmail.com</a>
        </div>
    </div>
</body>
</html>
