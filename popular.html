<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Popular Books - Book Recommender System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">

    <style>
        body { background: #121212; color: white; }
        .navbar { background: #fff8dc !important; border: none; border-radius: 0; margin-bottom: 40px; padding: 10px 0; }
        .navbar-brand { font-size: 24px; font-weight: bold; color: #222 !important; }
        .navbar-nav li a { color: #222 !important; font-weight: 600; }
        .navbar-nav li a:hover { background: transparent !important; color: #ff9800 !important; }
        .page-title { color: white; font-size: 48px; font-weight: bold; margin-bottom: 30px; }
        .card { background: #1e1e1e; border-radius: 15px; overflow: hidden; padding: 15px; height: 500px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); transition: all .3s ease; }
        .card:hover { transform: translateY(-6px); }
        .card-img-top { width: 100%; height: 300px; object-fit: cover; border-radius: 10px; }
        .book-title { color: #fff; font-size: 16px; font-weight: bold; min-height: 45px; margin-top: 10px;}
        .author { color: #cfcfcf; font-size: 14px; }
        .stats { color: #ffcc66; font-size: 14px; margin: 4px 0; }
        a.card-link { text-decoration: none; }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand">Libro</a>
            <ul class="nav navbar-nav">
                <li><a href="/">Home</a></li>
                <li><a href="/popular">Popular Books</a></li>
                <li><a href="/recommend">Recommend</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1 class="page-title">Top 50 Books</h1>
            </div>

            {% for i in range(book_name|length) %}
            <div class="col-md-3" style="margin-bottom:30px">
                <a href="https://www.amazon.com/s?k={{ book_name[i] }} book" target="_blank" class="card-link">
                    <div class="card">
                        <img class="card-img-top" src="{{ image[i] }}">
                        <div class="card-body">
                            <p class="book-title">{{ book_name[i] }}</p>
                            <p class="author">✍ {{ author[i] }}</p>
                            <p class="stats">⭐ Rating: {{ rating[i] }}</p>
                            <p class="stats">👍 Votes: {{ votes[i] }}</p>
                        </div>
                    </div>
                </a>
            </div>
            {% endfor %}

        </div>
    </div>
</body>
</html>
