<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recommend - Book Recommender System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">

    <style>
        body { background: #121212; color: white; }
        .navbar { background: #fff8dc !important; border: none; border-radius: 0; margin-bottom: 40px; padding: 10px 0; }
        .navbar-brand { font-size: 24px; font-weight: bold; color: #222 !important; }
        .navbar-nav li a { color: #222 !important; font-weight: 600; }
        .navbar-nav li a:hover { background: transparent !important; color: #ff9800 !important; }
        .page-title { text-align: center; font-size: 48px; font-weight: bold; margin-bottom: 10px; }
        .sub-title { text-align: center; font-size: 20px; color: #cfcfcf; margin-bottom: 30px; font-style: italic; }
        .search-box { max-width: 700px; margin: 0 auto; }
        .form-control { height: 50px; font-size: 18px; border-radius: 10px; border: none; }
        .search-btn { display: block; margin: 15px auto 0; padding: 12px 30px; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; }
        .card { background: #1e1e1e; border-radius: 15px; overflow: hidden; padding: 15px; height: 430px; box-shadow: 0 5px 20px rgba(0,0,0,0.4); transition: all .3s ease; }
        .card:hover { transform: translateY(-6px); }
        .card-img-top { width: 100%; height: 300px; object-fit: cover; border-radius: 10px; }
        .book-title { color: #fff; font-size: 16px; font-weight: bold; margin-top: 15px; min-height: 40px;}
        .author { color: #cfcfcf; font-size: 14px; }
        a.card-link { text-decoration: none; }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand">Libro</a>
            <ul class="nav navbar-nav">
                <li><a href="/">Home</a></li>
                <li><a href="/popular">Popular Books</a></li>
                <li><a href="/recommend">Recommend</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">Recommend Books</h1>
        <p class="sub-title">search from our large collection</p>

        <form action="/recommend_books" method="POST" class="search-box">
            <input type="text" name="user_input" class="form-control" placeholder="Enter Book Title" required>
            <input type="submit" value="Recommend" class="btn btn-warning btn-lg search-btn">
        </form>

        {% if error %}
        <div class="alert alert-danger text-center" style="margin-top:20px; max-width: 700px; margin-left: auto; margin-right: auto;">
            {{ error }}
        </div>
        {% endif %}

        <div class="row">
            {% if data %}
                {% for i in data %}
                <div class="col-md-3" style="margin-top:40px;">
                    <a href="https://www.amazon.com/s?k={{ i[0] }} book" target="_blank" class="card-link">
                        <div class="card">
                            <img class="card-img-top" src="{{ i[2] }}">
                            <p class="book-title">{{ i[0] }}</p>
                            <p class="author">{{ i[1] }}</p>
                        </div>
                    </a>
                </div>
                {% endfor %}
            {% endif %}
        </div>
    </div>
</body>
</html>
